[project]
name = "metsateatise-moju"
version = "0.1.0"
description = "Streamlit app for estimating the biomass carbon associated with Estonian forest notices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "folium>=0.17",
  "geopandas>=1.0",
  "nest-asyncio>=1.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pyproj>=3.6",
  "requests>=2.32",
  "shapely>=2.0",
  "streamlit>=1.37",
  "streamlit-folium>=0.22",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".codex-tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:terminalprogress"
pythonpath = ["."]
markers = ["live: queries public Forest Register endpoints"]
